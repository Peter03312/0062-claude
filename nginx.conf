server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：找不到文件时回退首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（内容哈希文件名，可安全长缓存）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
